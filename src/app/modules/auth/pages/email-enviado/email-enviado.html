<div class="flex align-items-center justify-content-center min-h-screen surface-ground px-4">
  <p-card class="w-full md:w-5 lg:w-4 text-center">
    <div class="flex flex-column align-items-center gap-4">
      <i class="pi pi-envelope text-primary" style="font-size: 3rem"></i>
      <h2 class="m-0">¡Revisá tu email!</h2>
      <p class="text-color-secondary m-0">
        Te enviamos un link de verificación. Hacé clic en él para activar tu cuenta.
        Si no lo ves, revisá la carpeta de spam.
      </p>
      <p-button
        label="Ir al login"
        icon="pi pi-sign-in"
        [routerLink]="'/auth/login'"
        styleClass="w-full"
      />
    </div>
  </p-card>
</div>
