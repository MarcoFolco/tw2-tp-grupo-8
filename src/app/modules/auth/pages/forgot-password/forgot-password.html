<div class="flex align-items-center justify-content-center min-h-screen surface-ground px-4">
  <p-card class="w-full md:w-5 lg:w-4" header="Recuperar contraseña">

    @if (enviado()) {
      <div class="flex flex-column align-items-center gap-4 text-center">
        <i class="pi pi-envelope text-primary" style="font-size: 3rem"></i>
        <p class="text-color-secondary m-0">
          Si el email está registrado, te enviamos instrucciones para recuperar tu contraseña.
          Revisá tu bandeja de entrada y la carpeta de spam.
        </p>
        <a [routerLink]="'/auth/login'" class="text-primary no-underline font-medium">
          Volver al login
        </a>
      </div>
    } @else {
      <form [formGroup]="form" (ngSubmit)="onSubmit()" class="flex flex-column gap-4">

        <p class="text-color-secondary m-0">
          Ingresá tu email y te enviamos un link para restablecer tu contraseña.
        </p>

        <div class="flex flex-column gap-2">
          <label for="email" class="font-medium">Email</label>
          <input
            pInputText
            id="email"
            type="email"
            formControlName="email"
            placeholder="email@ejemplo.com"
            class="w-full"
          />
        </div>

        <p-button
          type="submit"
          label="Enviar link"
          icon="pi pi-send"
          [loading]="loading()"
          [disabled]="form.invalid || loading()"
          styleClass="w-full"
        />

      </form>

      <div class="text-center mt-4">
        <a [routerLink]="'/auth/login'" class="text-color-secondary no-underline">
          Volver al login
        </a>
      </div>
    }

  </p-card>
</div>
