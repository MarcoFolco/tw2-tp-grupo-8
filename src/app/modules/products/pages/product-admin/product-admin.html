<div class="p-8 max-w-7xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Panel de Control: Productos</h1>
    
    <button routerLink="/admin/products/new" class="bg-green-600 hover:bg-green-500 text-white font-bold py-2 px-4 rounded shadow">
      + Nuevo Producto
    </button>
  </div>

  <div class="bg-black text-white shadow-md rounded overflow-hidden">
    <table class="w-full text-left border-collapse">
      <thead>
        <tr class="bg-gray-800 text-white">
          <th class="p-3">ID</th>
          <th class="p-3">Nombre</th>
          <th class="p-3">Precio</th>
          <th class="p-3">Stock</th>
          <th class="p-3 text-center">Acciones</th>
        </tr>
      </thead>
      <tbody>
        @for (prod of productos(); track prod.id) {
          <tr class="border-b hover:bg-gray-200 hover:text-gray-800 transition">
            <td class="p-3 font-bold text-gray-500">#{{ prod.id }}</td>
            <td class="p-3 font-semibold">{{ prod.nombre }}</td>
            <td class="p-3 text-blue-600 font-bold">{{ prod.precio | currency:'$ ':'symbol':'1.0-0' }}</td>
            <td class="p-3">
              <span class="px-2 py-1 rounded text-sm font-bold"
                    [class.bg-red-200]="prod.stock === 0" [class.text-red-700]="prod.stock === 0"
                    [class.bg-green-200]="prod.stock > 0" [class.text-green-700]="prod.stock > 0">
                {{ prod.stock }}
              </span>
            </td>
            <td class="p-3 flex justify-center gap-2">
                      <button [routerLink]="['/admin/products/edit', prod.slug]" class="bg-blue-500 hover:bg-blue-400 text-white px-3 py-1 rounded text-sm">
      Editar
    </button>
              <button (click)="borrarProducto(prod.id)" class="bg-red-500 hover:bg-red-400 text-white px-3 py-1 rounded text-sm">
                Borrar
              </button>
            </td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>
