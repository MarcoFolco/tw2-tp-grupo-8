<div class="p-8 max-w-7xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-3xl font-bold">Panel de Control: Productos</h1>
    <p-button routerLink="/products/admin/new" label="Nuevo Producto" icon="pi pi-plus" severity="success" />
  </div>

  <p-table [value]="productos()" [paginator]="true" [rows]="10" stripedRows>
    <ng-template #header>
      <tr>
        <th pSortableColumn="id">ID <p-sortIcon field="id" /></th>
        <th pSortableColumn="nombre">Nombre <p-sortIcon field="nombre" /></th>
        <th pSortableColumn="precio">Precio <p-sortIcon field="precio" /></th>
        <th pSortableColumn="stock">Stock <p-sortIcon field="stock" /></th>
        <th class="text-center">Acciones</th>
      </tr>
    </ng-template>
    <ng-template #body let-prod>
      <tr>
        <td class="text-gray-500 font-bold">#{{ prod.id }}</td>
        <td class="font-semibold">{{ prod.nombre }}</td>
        <td>{{ prod.precio | currency:'$ ':'symbol':'1.0-0' }}</td>
        <td>
          <p-tag
            [value]="prod.stock.toString()"
            [severity]="prod.stock === 0 ? 'danger' : 'success'"
          />
        </td>
        <td class="flex justify-center gap-2">
          <p-button [routerLink]="['/products/admin/edit', prod.slug]"
                    label="Editar" icon="pi pi-pencil" severity="info" size="small" />
          <p-button (onClick)="borrarProducto(prod.id)"
                    label="Borrar" icon="pi pi-trash" severity="danger" size="small" />
        </td>
      </tr>
    </ng-template>
  </p-table>
</div>
