<div class="p-8 max-w-2xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h1 class="text-2xl font-bold">Editar Producto</h1>
    <a routerLink="/products/admin" class="text-blue-500 hover:underline">Volver</a>
  </div>

  @if (producto()) {
    <app-product-form [producto]="producto()" (formSubmit)="actualizarProducto($event)" />
  } @else {
    <p class="text-gray-500">Cargando producto...</p>
  }
</div>
