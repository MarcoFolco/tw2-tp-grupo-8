<div class="p-5 flex justify-center">
  @if (loading()) {
    <div class="card flex justify-center">
      <p-progress-spinner
        strokeWidth="8"
        fill="transparent"
        animationDuration=".5s"
        [style]="{ width: '50px', height: '50px' }"
      />
    </div>
  } @else {
    <div class="flex flex-col items-start gap-5">
      <input
        (input)="updateText($event)"
        type="text"
        class="border border-white p-2 w-full max-w-100 rounded-2xl"
        placeholder="Lenovo Legion 5"
      />
      <div class="w-full min-h-full max-w-300 flex gap-5 flex-wrap justify-center items-center">
        @if (filterProducts().length > 0) {
          @for (product of filterProducts(); track $index) {
            <app-product-card [producto]="product"></app-product-card>
          }
        } @else {
          <p>No se encontraron productos.</p>
        }
      </div>
    </div>
  }
</div>
