<div class="p-5 flex justify-center">
  @if (loading()) {
    <div class="card flex justify-center">
      <p-progress-spinner
        strokeWidth="8"
        fill="transparent"
        animationDuration=".5s"
        [style]="{ width: '50px', height: '50px' }"
      />
    </div>
  } @else {
    <div class="flex flex-col items-center w-full max-w-6xl gap-5 mx-auto">
      <app-search-bar (searchChanged)="buscarProductosPorNombre($event)" />
      <div class="flex gap-3 w-full max-w-100 justify-center my-2">
        <button
          (click)="loadProducts()"
          class="px-4 py-2 bg-gray-700 text-white rounded hover:bg-gray-600 cursor-pointer"
        >
          Todos
        </button>

        <button
          (click)="loadProducts('Notebooks')"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-500 cursor-pointer"
        >
          Notebooks
        </button>

        <button
          (click)="loadProducts('Smartphones')"
          class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-500 cursor-pointer"
        >
          Smartphones
        </button>
      </div>

      <div class="w-full flex gap-6 flex-wrap justify-center items-center pb-16">
        @if (filterProducts().length > 0) {
          @for (product of filterProducts(); track $index) {
            <app-product-card [producto]="product"></app-product-card>
          }
        } @else {
          <p>No se encontraron productos.</p>
        }
      </div>
    </div>
  }
</div>
