<div class="p-5 flex justify-center">
  <div class="flex flex-col items-center w-full max-w-6xl gap-5 mx-auto">

    <div class="flex gap-4 w-full max-w-2xl items-center">
      <div class="flex-1">
        <app-search-bar (searchChanged)="nombre.set($event)" />
      </div>
      <p-select
        [ngModel]="categoriaId()"
        (ngModelChange)="categoriaId.set($event)"
        [options]="categorias()"
        optionLabel="nombre"
        optionValue="id"
        placeholder="Todas las categorías"
        [showClear]="true"
      />
    </div>

    @if (loading()) {
      <div class="flex justify-center py-10">
        <p-progress-spinner
          strokeWidth="8"
          fill="transparent"
          animationDuration=".5s"
          [style]="{ width: '50px', height: '50px' }"
        />
      </div>
    } @else {
      <div class="w-full flex gap-6 flex-wrap justify-center items-center pb-16">
        @if (products().length > 0) {
          @for (product of products(); track product.id) {
            <app-product-card [producto]="product" />
          }
        } @else {
          <p class="text-zinc-400">No se encontraron productos.</p>
        }
      </div>
    }

  </div>
</div>
