<div class="relative w-full max-w-md">
  <i class="pi pi-search absolute left-3 top-1/2 -translate-y-1/2 text-gray-400 text-sm"></i>
  <input
    type="text"
    [formControl]="searchControl"
    placeholder="Buscar productos..."
    class="w-full pl-9 pr-9 py-2 text-sm bg-transparent border-b border-gray-300 focus:border-gray-600 outline-none transition-colors placeholder:text-gray-400"
  />
  @if (searchControl.value) {
    <button
      type="button"
      (click)="clear()"
      class="absolute right-2 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 cursor-pointer"
    >
      <i class="pi pi-times text-xs"></i>
    </button>
  }
</div>
